<title>Kids·Place Admin</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&family=Patrick+Hand&display=swap">
<style>
/* Layout: panel de trabajo — barra lateral de secciones + área de contenido; en móvil la barra pasa a pestañas superiores */
:root{
  --orange:#f4a546; --blue:#395f72; --teal:#90C7C1;
  --bg:#f3f7f6; --surface:#ffffff; --ink:#23404c; --ink-2:#5d7682; --line:#dfe9e7; --line-strong:#c4d6d3;
  --chip:#eaf4f2; --brand-ink:#395f72; --logo-plate:transparent; --on-orange:#3b2608; --side:#395f72; --side-ink:#e3eef0;
  --ok:#2f8a5b; --ok-bg:#e1f3e8; --warn:#a2650f; --warn-bg:#fdf0da; --bad:#b4433b; --bad-bg:#fbe5e2;
  --map-land:#eef3ea; --map-park:#c6e3bd; --map-water:#b9dde4; --map-road:#ffffff; --map-major:#fbe2bd; --map-mountain:#d3e6cb;
  --ph-base:#fdf3e4; --shadow:0 6px 24px rgba(35,64,76,.12);
  /* Patrick Hand: sustituto temporal de Brownist */
  --font-display:"Patrick Hand","Nunito",ui-rounded,system-ui,sans-serif;
  --font-body:"Nunito",ui-rounded,system-ui,-apple-system,"Segoe UI",sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#12201f; --surface:#182a2f; --ink:#e6f0ee; --ink-2:#9db4b6; --line:#28403f; --line-strong:#3a5655;
  --chip:#20363a; --brand-ink:#90C7C1; --logo-plate:#f3f7f6; --side:#0f1b1d; --side-ink:#cfe0e1;
  --ok:#6fd19a; --ok-bg:#1d3b2c; --warn:#f2bf6b; --warn-bg:#3d3020; --bad:#f08a80; --bad-bg:#422523;
  --map-land:#172629; --map-park:#214432; --map-water:#1b3f4c; --map-road:#27393d; --map-major:#4a3c27; --map-mountain:#1c3a2b;
  --ph-base:#1f3337; --shadow:0 6px 24px rgba(0,0,0,.45); color-scheme:dark;
}}
:root[data-theme="dark"]{
  --bg:#12201f; --surface:#182a2f; --ink:#e6f0ee; --ink-2:#9db4b6; --line:#28403f; --line-strong:#3a5655;
  --chip:#20363a; --brand-ink:#90C7C1; --logo-plate:#f3f7f6; --side:#0f1b1d; --side-ink:#cfe0e1;
  --ok:#6fd19a; --ok-bg:#1d3b2c; --warn:#f2bf6b; --warn-bg:#3d3020; --bad:#f08a80; --bad-bg:#422523;
  --map-land:#172629; --map-park:#214432; --map-water:#1b3f4c; --map-road:#27393d; --map-major:#4a3c27; --map-mountain:#1c3a2b;
  --ph-base:#1f3337; --shadow:0 6px 24px rgba(0,0,0,.45); color-scheme:dark;
}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--font-body);font-size:14.5px;line-height:1.5}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--orange);outline-offset:2px;border-radius:8px}
.ic{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}

.shell{min-height:100%;display:grid;grid-template-columns:232px 1fr}
.side{background:var(--side);color:var(--side-ink);padding:18px 12px;display:flex;flex-direction:column;gap:18px;position:sticky;top:0;height:100vh;height:100dvh}
.side .brand{background:#f3f7f6;border-radius:14px;padding:8px 10px;display:flex;align-items:center;justify-content:center}
.side .brand img{height:30px}
.side .role{font-size:11px;letter-spacing:.14em;text-transform:uppercase;font-weight:800;opacity:.7;padding:0 10px}
.nav{display:flex;flex-direction:column;gap:2px}
.nav button{display:flex;align-items:center;gap:10px;background:none;border:0;color:inherit;padding:9px 12px;border-radius:12px;font-weight:700;text-align:left}
.nav button:hover{background:rgba(255,255,255,.08)}
.nav button[aria-current="page"]{background:var(--orange);color:var(--on-orange)}
.nav .count{margin-left:auto;font-size:12px;opacity:.75;font-variant-numeric:tabular-nums}
.side .foot{margin-top:auto;font-size:12px;opacity:.75;padding:0 10px}

.content{min-width:0;padding:22px 28px 48px}
.proto{background:var(--chip);color:var(--ink-2);font-size:12px;padding:5px 12px;border-radius:999px;display:inline-block;margin-bottom:14px}
.head{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:18px}
.head h1{font-family:var(--font-display);font-weight:400;font-size:36px;line-height:1;margin:0;color:var(--brand-ink)}
.head p{margin:4px 0 0;color:var(--ink-2)}
.btn{display:inline-flex;align-items:center;gap:8px;border-radius:999px;padding:9px 16px;font-weight:800;border:1.5px solid transparent;white-space:nowrap;font-size:14px;background:none}
.btn-primary{background:var(--orange);color:var(--on-orange)}
.btn-blue{background:var(--blue);color:#fff}
.btn-ghost{border-color:var(--line-strong)}
.btn-ghost:hover{background:var(--chip)}
.btn-sm{padding:5px 11px;font-size:13px}

.panel{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:18px}
.panel h2{margin:0 0 12px;font-size:15px}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px;margin-bottom:16px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:14px 16px}
.kpi small{color:var(--ink-2);font-weight:700;font-size:12.5px}
.kpi b{display:block;font-size:30px;line-height:1.1;font-variant-numeric:tabular-nums;margin-top:2px}
.kpi span{font-size:12.5px;color:var(--ink-2)}
.grid2{display:grid;grid-template-columns:1.4fr 1fr;gap:16px}
.todo{display:flex;flex-direction:column;gap:8px;margin:0;padding:0;list-style:none}
.todo li{display:flex;gap:10px;align-items:flex-start;padding:10px 12px;border-radius:12px;background:var(--chip);font-size:13.5px}

.toolbar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}
.toolbar input,.toolbar select{border:1.5px solid var(--line);background:var(--surface);border-radius:12px;padding:8px 12px}
.toolbar input{flex:1;min-width:180px}
.tablewrap{overflow-x:auto;background:var(--surface);border:1px solid var(--line);border-radius:18px}
table{width:100%;border-collapse:collapse;font-size:14px}
th{text-align:left;font-size:11.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-2);font-weight:800;padding:12px 14px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:10px 14px;border-bottom:1px solid var(--line);vertical-align:middle}
tr:last-child td{border-bottom:0}
tbody tr.click{cursor:pointer}
tbody tr.click:hover{background:var(--chip)}
td.num{font-variant-numeric:tabular-nums;text-align:right}
.namecell{display:flex;align-items:center;gap:10px;min-width:200px}
.namecell .th{width:40px;height:40px;border-radius:10px;overflow:hidden;position:relative;flex:none}
.namecell b{display:block}
.namecell small{color:var(--ink-2)}
.catline{display:inline-flex;align-items:center;gap:6px;font-weight:700;white-space:nowrap}
.catline i{width:9px;height:9px;border-radius:50%;background:var(--c)}
.pill{display:inline-flex;align-items:center;gap:5px;border-radius:999px;padding:2px 10px;font-size:12px;font-weight:800;white-space:nowrap}
.pill::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
.pill.ok{background:var(--ok-bg);color:var(--ok)}
.pill.warn{background:var(--warn-bg);color:var(--warn)}
.pill.bad{background:var(--bad-bg);color:var(--bad)}
.pill.off{background:var(--chip);color:var(--ink-2)}

/* Editor */
.editor{display:grid;grid-template-columns:minmax(0,1fr) 320px;gap:16px;align-items:start}
.form{display:flex;flex-direction:column;gap:16px}
.fields{display:grid;grid-template-columns:1fr 1fr;gap:12px 14px}
.field{display:flex;flex-direction:column;gap:5px;min-width:0}
.field.full{grid-column:1/-1}
.field label{font-weight:800;font-size:13px}
.field label small{font-weight:600;color:var(--ink-2)}
.field input,.field select,.field textarea{border:1.5px solid var(--line);background:var(--bg);border-radius:12px;padding:9px 12px;width:100%}
.field textarea{min-height:96px;resize:vertical}
.field input:focus,.field select:focus,.field textarea:focus{outline:none;border-color:var(--teal)}
.field .err{color:var(--bad);font-size:12.5px;font-weight:700}
.checks{display:flex;flex-wrap:wrap;gap:6px}
.checks label{display:inline-flex;align-items:center;gap:6px;border:1.5px solid var(--line);border-radius:999px;padding:5px 11px;font-size:13px;font-weight:700;cursor:pointer}
.checks input{accent-color:var(--blue)}
.checks label:has(input:checked){background:var(--chip);border-color:var(--teal)}
.minimap{position:relative;aspect-ratio:16/9;max-width:100%;border-radius:14px;overflow:hidden;cursor:crosshair;border:1.5px solid var(--line)}
.minimap svg{width:100%;height:100%;display:block}
.minimap .pin{position:absolute;width:30px;height:38px;transform:translate(-50%,-100%);pointer-events:none;filter:drop-shadow(0 2px 3px rgba(0,0,0,.3))}
.hint{font-size:12.5px;color:var(--ink-2);margin:6px 0 0}
.photos{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:10px}
.photo{position:relative;aspect-ratio:4/3;border-radius:12px;overflow:hidden;background:var(--ph-base)}
.photo img{width:100%;height:100%;object-fit:cover;display:block}
.photo .badge{position:absolute;left:6px;top:6px;background:var(--orange);color:var(--on-orange);font-size:11px;font-weight:800;padding:1px 8px;border-radius:999px}
.photo .tools{position:absolute;right:6px;top:6px;display:flex;gap:4px}
.photo .tools button{width:26px;height:26px;border-radius:8px;border:0;background:rgba(255,255,255,.92);color:#23404c;display:grid;place-items:center;font-weight:800}
.photo .tools .ic{width:14px;height:14px}
.drop{border:2px dashed var(--line-strong);border-radius:12px;display:grid;place-items:center;text-align:center;gap:4px;padding:10px;color:var(--ink-2);font-weight:700;font-size:13px;cursor:pointer;aspect-ratio:4/3}
.drop:hover,.drop.over{border-color:var(--teal);background:var(--chip)}
.ph{position:absolute;inset:0}
.ph svg{width:100%;height:100%;display:block}
.aside{position:sticky;top:16px;display:flex;flex-direction:column;gap:12px}
.aside h3{margin:0;font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--ink-2)}
.status{display:flex;gap:6px;background:var(--chip);border-radius:999px;padding:4px}
.status button{flex:1;border:0;background:none;border-radius:999px;padding:7px;font-weight:800;font-size:13px}
.status button[aria-pressed="true"]{background:var(--surface);box-shadow:0 1px 4px rgba(0,0,0,.12)}
.preview{border:1px solid var(--line);border-radius:16px;overflow:hidden;background:var(--surface)}
.preview .cover{position:relative;aspect-ratio:16/10}
.preview .cover img{width:100%;height:100%;object-fit:cover;display:block}
.preview .b{padding:12px 14px}
.preview h4{font-family:var(--font-display);font-weight:400;font-size:26px;line-height:1.05;margin:4px 0 2px;color:var(--brand-ink);overflow-wrap:anywhere}
.preview p{margin:0;font-size:13px;color:var(--ink-2)}
.checklist{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px;font-size:13px}
.checklist li{display:flex;gap:8px;align-items:center}
.checklist li.ok{color:var(--ok)}
.checklist li.no{color:var(--ink-2)}
.actions{display:flex;gap:8px;flex-wrap:wrap}
.actions .btn{flex:1;justify-content:center}

/* Importador */
.steps{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}
.steps span{display:inline-flex;align-items:center;gap:8px;font-weight:800;font-size:13px;color:var(--ink-2)}
.steps span b{width:24px;height:24px;border-radius:50%;display:grid;place-items:center;background:var(--chip);color:var(--ink-2);font-size:12px}
.steps span.on{color:var(--ink)}
.steps span.on b{background:var(--blue);color:#fff}
.steps i{width:24px;height:2px;background:var(--line);align-self:center}
.bigdrop{border:2px dashed var(--line-strong);border-radius:18px;padding:34px 18px;text-align:center;background:var(--surface);cursor:pointer}
.bigdrop.over{border-color:var(--teal);background:var(--chip)}
.bigdrop img{width:84px}
.bigdrop h3{font-family:var(--font-display);font-weight:400;font-size:26px;margin:6px 0 2px;color:var(--brand-ink)}
.bigdrop p{margin:0;color:var(--ink-2)}
.summary{display:flex;gap:10px;flex-wrap:wrap;margin:14px 0}
.issue{color:var(--warn);font-size:12.5px;font-weight:700}
.issue.bad{color:var(--bad)}

.colorsw{width:22px;height:22px;border-radius:7px;background:var(--c);display:inline-block;vertical-align:middle}
.bar{height:8px;border-radius:99px;background:var(--chip);overflow:hidden;min-width:80px}
.bar i{display:block;height:100%;background:var(--teal)}
.adprev{display:grid;grid-template-columns:44px 1fr;gap:10px;align-items:center}
.adprev .lg{width:44px;height:44px;border-radius:10px;display:grid;place-items:center;font-family:var(--font-display);font-size:20px;background:#f6d9a8;color:#5a3a0e}

.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--blue);color:#fff;padding:10px 18px;border-radius:999px;font-weight:700;box-shadow:var(--shadow);z-index:90;max-width:calc(100% - 32px);text-align:center}

@media (max-width:980px){ .editor,.grid2{grid-template-columns:1fr} .aside{position:static} }
@media (max-width:760px){
  .shell{grid-template-columns:1fr}
  .side{position:sticky;top:env(safe-area-inset-top,0px);height:auto;z-index:20;padding:10px 16px;gap:10px;flex-direction:row;align-items:center;overflow-x:auto}
  .side .brand img{height:22px}
  .side .role,.side .foot{display:none}
  .nav{flex-direction:row}
  .nav button{padding:7px 10px;white-space:nowrap}
  .nav .count{display:none}
  .nav button span.t{display:none}
  .nav button[aria-current="page"] span.t{display:inline}
  .content{padding:16px 16px 40px}
  .fields{grid-template-columns:1fr}
  .head h1{font-size:30px}
}
</style>

function miniMap(){return `<svg viewBox="0 0 320 180" preserveAspectRatio="none" aria-hidden="true"><rect width="320" height="180" fill="var(--map-land)"/>

function pin(){
  const d=state.draft,el=$("#mmPin");if(!el)return;
  const la=parseFloat(d.lat),ln=parseFloat(d.lng);
  if(isNaN(la)||isNaN(ln)){el.innerHTML="";return}
  const fx=(ln-BOX.lng0)/(BOX.lng1-BOX.lng0),fy=(la-BOX.lat0)/(BOX.lat1-BOX.lat0);
  if(fx<0||fx>1||fy<0||fy>1){el.innerHTML="";return}
  const c=cat(d.cat).color;
  el.innerHTML=`<svg class="pin" style="left:${fx*100}%;top:${fy*100}%" viewBox="0 0 40 50"><path d="M20 49C20 49 3 30.5 3 19a17 17 0 0 1 34 0c0 11.5-17 30-17 30z" fill="${c}" stroke="#fff" stroke-width="2.5"/><circle cx="20" cy="19" r="11" fill="#fff"/><g transform="translate(12 11) scale(.667)" fill="none" stroke="${c}" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="${ICONS[d.cat]}"/></g></svg>`;
}
function photos(){
  const d=state.draft;
  $("#photos").innerHTML=d.photos.map((p,i)=>`<div class="photo">${photoHTML(d,p,i)}${i===0?'<span class="badge">Portada</span>':""}
    <div class="tools">${i>0?`<button data-up="${i}" aria-label="Mover antes">${ic("up")}</button>`:""}<button data-del="${i}" aria-label="Quitar foto">${ic("x")}</button></div></div>`).join("")
    +`<div class="drop" id="drop" role="button" tabindex="0">${ic("plus")}<span>Subir fotos</span><small style="font-weight:600">o arrástralas aquí</small></div>`;
  document.querySelectorAll("[data-del]").forEach(b=>b.onclick=()=>{d.photos.splice(+b.dataset.del,1);photos();side()});
  document.querySelectorAll("[data-up]").forEach(b=>b.onclick=()=>{const i=+b.dataset.up;[d.photos[i-1],d.photos[i]]=[d.photos[i],d.photos[i-1]];photos();side()});
  const drop=$("#drop");
  drop.onclick=()=>$("#filePhotos").click();
  drop.onkeydown=ev=>{if(ev.key==="Enter"||ev.key===" "){ev.preventDefault();$("#filePhotos").click()}};
  drop.ondragover=ev=>{ev.preventDefault();drop.classList.add("over")};
  drop.ondragleave=()=>drop.classList.remove("over");
  drop.ondrop=ev=>{ev.preventDefault();drop.classList.remove("over");addPhotos(ev.dataTransfer.files)};
}
$("#filePhotos").onchange=ev=>{addPhotos(ev.target.files);ev.target.value=""};
function addPhotos(files){
  [...files].filter(f=>f.type.startsWith("image/")).forEach(f=>{const r=new FileReader();r.onload=()=>{state.draft.photos.push(r.result);photos();side()};r.readAsDataURL(f)});
}
function side(){
  const d=state.draft,k=cat(d.cat);
  $("#pv").innerHTML=`<div class="cover">${d.photos.length?photoHTML(d,d.photos[0],0):ph(k.color,0,d.cat)}</div>
    <div class="b"><span class="catline" style="--c:${k.color};font-size:12.5px"><i></i>${k.name}</span><h4>${d.name?esc(d.name):"Nombre del sitio"}</h4><p>${d.zone?esc(d.zone):"Zona"}, Caracas</p></div>`;
  const items=[["Nombre",!!d.name.trim()],["Zona y dirección",!!(d.zone.trim()&&d.address.trim())],["Descripción",!!d.desc.trim()],["Ubicación en el mapa",!!(d.lat&&d.lng)],["Al menos una foto",d.photos.length>0],["Servicios (opcional)",d.tags.length>0]];
  $("#cl").innerHTML=items.map(([t,ok])=>`<li class="${ok?"ok":"no"}">${ok?ic("check"):'<svg class="ic" viewBox="0 0 24 24"><circle cx="12" cy="12" r="7"/></svg>'} ${t}</li>`).join("");
}
function save(publish){
  const d=state.draft;state.errors=validate(d,publish);
  if(Object.keys(state.errors).length){viewEdit();toast(publish?"Faltan datos para publicar. Revisa los campos marcados.":"Escribe al menos el nombre del sitio.");return}
  if(publish)d.status="pub";
  d.updated="Ahora";
  if(state.editing){Object.assign(places.find(p=>p.id===state.editing),d)}else{places.unshift(d);state.editing=d.id}
  toast(publish?`“${d.name}” está publicado en el mapa`:"Borrador guardado");
  go("places");
}

/* ---------- Importar ---------- */
const SAMPLE=`nombre,categoria,ciudad,zona,direccion,latitud,longitud,descripcion,servicios,telefono,instagram,horario,precio
Parque Cristóbal Rojas,parques,Caracas,Altamira,Av. Luis Roche,10.4972,-66.8495,"Plaza con juegos infantiles y zona de sombra.",juegos;gratis;sombra,,,,0
Heladería La Nube,restaurantes,Caracas,Chacao,Calle Elice,10.4935,-66.8530,"Helados artesanales con mesas para familias.",menu;aire,0212-555-0111,@lanube.ejemplo,Todos los días 11:00–21:00,1
Mini Golf Las Colinas,juegos,Caracas,La Lagunita,Av. Principal de La Lagunita,,,"Mini golf de 18 hoyos.",estacionamiento,,,,2
Planetario Humboldt,museos,Caracas,Bellas Artes,Parque Los Caobos,10.5005,-66.8900,,aire;banos,,,,1
Club Piscinas del Sol,piscina,Caracas,Santa Fe,Calle Cerro Verde,10.4600,-66.8650,"Piscinas para niños y adultos.",banos;comida,,,,2`;
function parseCSV(t){
  const rows=[];let row=[],cell="",q=false;
  for(let i=0;i<t.length;i++){const c=t[i];
    if(q){if(c==='"'){if(t[i+1]==='"'){cell+='"';i++}else q=false}else cell+=c}
    else if(c==='"')q=true;else if(c===","){row.push(cell);cell=""}else if(c==="\n"||c==="\r"){if(c==="\r"&&t[i+1]==="\n")i++;row.push(cell);rows.push(row);row=[];cell=""}else cell+=c}
  if(cell||row.length){row.push(cell);rows.push(row)}
  const head=rows.shift().map(h=>h.trim().toLowerCase());
  return rows.filter(r=>r.some(x=>x.trim())).map(r=>Object.fromEntries(head.map((h,i)=>[h,(r[i]||"").trim()])));
}
function check(r){
  const issues=[];
  if(!r.nombre)issues.push(["bad","Falta el nombre"]);
  if(!CATS.some(c=>c.id===r.categoria))issues.push(["bad",`Categoría “${r.categoria||"vacía"}” no existe`]);
  if(!r.latitud||!r.longitud)issues.push(["warn","Sin coordenadas: se calcularán desde la dirección"]);
  if(!r.descripcion)issues.push(["warn","Sin descripción: entra como borrador"]);
  const bad=(r.servicios||"").split(";").filter(s=>s&&!TAGS[s]);
  if(bad.length)issues.push(["warn",`Servicio desconocido: ${bad.join(", ")}`]);
  return issues;
}
function viewImport(){
  const rows=state.importRows;
  const step=rows?2:1;
  let body;
  if(!rows){
    body=`<div class="bigdrop" id="bd" role="button" tabindex="0"><img src="${FACE}" alt=""><h3>Arrastra aquí tu archivo CSV</h3><p>o haz clic para elegirlo. El formato está en docs/06-formato-del-dataset.md.</p></div>
    <p class="hint" style="text-align:center;margin-top:12px">¿Sin archivo a mano? <button class="btn btn-ghost btn-sm" id="sample">Probar con un ejemplo</button></p>`;
  }else{
    const checked=rows.map(r=>({r,iss:check(r)}));
    const errs=checked.filter(x=>x.iss.some(i=>i[0]==="bad")).length, warns=checked.filter(x=>!x.iss.some(i=>i[0]==="bad")&&x.iss.length).length, ok=checked.length-errs-warns;
    body=`<div class="panel"><h2>${esc(state.importName)} · ${rows.length} filas</h2>
      <div class="summary"><span class="pill ok">${ok} listas</span><span class="pill warn">${warns} con avisos</span><span class="pill bad">${errs} con errores (no se importan)</span></div>
      <div class="tablewrap"><table><thead><tr><th>#</th><th>Nombre</th><th>Categoría</th><th>Zona</th><th>Coordenadas</th><th>Revisión</th></tr></thead><tbody>
      ${checked.map(({r,iss},i)=>`<tr><td class="num">${i+1}</td><td><b>${esc(r.nombre)}</b></td>
        <td>${CATS.some(c=>c.id===r.categoria)?`<span class="catline" style="--c:${cat(r.categoria).color}"><i></i>${cat(r.categoria).name}</span>`:esc(r.categoria)}</td>
        <td>${esc(r.zona)}</td><td style="font-variant-numeric:tabular-nums;white-space:nowrap">${r.latitud&&r.longitud?`${esc(r.latitud)}, ${esc(r.longitud)}`:"—"}</td>
        <td>${iss.length?iss.map(([t,m])=>`<div class="issue ${t==="bad"?"bad":""}">${esc(m)}</div>`).join(""):'<span class="pill ok">OK</span>'}</td></tr>`).join("")}
      </tbody></table></div>
      <div class="actions" style="margin-top:14px;justify-content:flex-end"><button class="btn btn-ghost" id="reset" style="flex:0">Elegir otro archivo</button><button class="btn btn-primary" id="doImport" style="flex:0" ${ok+warns?"":"disabled"}>Importar ${ok+warns} sitios como borrador</button></div></div>`;
  }
  $("#content").innerHTML=`${proto}
  <div class="head"><div><h1>Importar dataset</h1><p>Los sitios entran como borrador para revisarlos antes de publicarlos.</p></div></div>
  <div class="steps"><span class="${step>=1?"on":""}"><b>1</b>Subir archivo</span><i></i><span class="${step>=2?"on":""}"><b>2</b>Revisar</span><i></i><span><b>3</b>Importar</span></div>${body}`;
  if(!rows){
    const bd=$("#bd");
    bd.onclick=()=>$("#fileCsv").click();
    bd.onkeydown=ev=>{if(ev.key==="Enter"||ev.key===" "){ev.preventDefault();$("#fileCsv").click()}};
    bd.ondragover=ev=>{ev.preventDefault();bd.classList.add("over")};
    bd.ondragleave=()=>bd.classList.remove("over");
    bd.ondrop=ev=>{ev.preventDefault();bd.classList.remove("over");if(ev.dataTransfer.files[0])readCsv(ev.dataTransfer.files[0])};
    $("#sample").onclick=()=>loadRows(SAMPLE,"ejemplo.csv");
  }else{
    $("#reset").onclick=()=>{state.importRows=null;render()};
    $("#doImport").onclick=()=>{
      let n=0;state.importRows.forEach(r=>{if(check(r).some(i=>i[0]==="bad"))return;n++;
        places.unshift(P({name:r.nombre,cat:r.categoria,zone:r.zona||"",address:r.direccion||"",lat:r.latitud||"",lng:r.longitud||"",desc:r.descripcion||"",tags:(r.servicios||"").split(";").filter(s=>TAGS[s]),phone:r.telefono||"",ig:r.instagram||"",hours:r.horario||"",price:r.precio||"0",status:"draft",updated:"Ahora"}))});
      state.importRows=null;toast(`${n} sitios importados como borrador`);go("places");
    };
  }
}
$("#fileCsv").onchange=ev=>{const f=ev.target.files[0];if(f)readCsv(f);ev.target.value=""};
function readCsv(f){const r=new FileReader();r.onload=()=>loadRows(String(r.result),f.name);r.readAsText(f)}
function loadRows(text,name){
  try{const rows=parseCSV(text);if(!rows.length)throw 0;state.importRows=rows;state.importName=name;render()}
  catch(_){toast("No pudimos leer el archivo. Revisa que sea un CSV con encabezados.")}
}
